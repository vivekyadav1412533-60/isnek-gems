<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gemini AI Studio</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#0b1020;color:white;
 font-family:Arial,sans-serif;
 height:100vh;display:flex;
}
.sidebar{
 width:250px;background:#11182b;
 padding:20px;
 border-right:1px solid #29334b;
}
.logo{font-size:24px;color:#8b9cff;font-weight:bold;margin-bottom:30px}
button{cursor:pointer;border:0;border-radius:10px;padding:12px}
.new{
 width:100%;background:#29375a;color:white;
 margin-bottom:20px;
}
.main{flex:1;display:flex;flex-direction:column}
.top{
 padding:20px;border-bottom:1px solid #29334b;
 font-size:20px;font-weight:bold;
}
.chat{
 flex:1;overflow-y:auto;padding:25px;
 display:flex;flex-direction:column;gap:18px;
}
.msg{
 max-width:80%;padding:15px;border-radius:15px;
 line-height:1.6;white-space:pre-wrap;
}
.user{background:#304b87;align-self:flex-end}
.ai{background:#19243b;align-self:flex-start}
.bottom{padding:20px;display:flex;gap:10px}
input{
 flex:1;padding:16px;border-radius:12px;
 border:1px solid #394765;background:#172139;
 color:white;outline:none;font-size:16px;
}
.send{background:#657cff;color:white;font-weight:bold}
.key{
 padding:12px 20px;background:#11182b;
 border-top:1px solid #29334b;
}
.key input{width:100%;margin-top:8px}
@media(max-width:600px){
 .sidebar{width:75px;padding:10px}
 .logo{font-size:13px}
 .new{font-size:10px;padding:8px}
 .chat{padding:12px}
 .bottom{padding:10px}
}
</style>
</head>

<body>

<aside class="sidebar">
 <div class="logo">✦ Gemini AI</div>
 <button class="new" onclick="newChat()">+ New Chat</button>
 <p style="color:#9ba8c5;font-size:13px">Your AI Assistant</p>
</aside>

<main class="main">
 <div class="top">✦ Gemini AI Studio</div>

 <div class="chat" id="chat">
  <div class="msg ai">
   नमस्ते! मैं Gemini AI Assistant हूँ।
   आप मुझसे कुछ भी पूछ सकते हैं।
  </div>
 </div>

 <div class="bottom">
  <input id="question" placeholder="Ask me anything..."
   onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="send" onclick="sendMessage()">Send ➤</button>
 </div>

 <div class="key">
  <label>Gemini API Key:</label>
  <input id="apiKey" type="password"
   placeholder="Paste your Gemini API key">
  <p style="font-size:11px;color:#9ba8c5;margin-top:6px">
   API key is kept in page memory only.
  </p>
 </div>
</main>

<script>
const chat=document.getElementById("chat");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
 return div;
}

async function sendMessage(){
 const input=document.getElementById("question");
 const key=document.getElementById("apiKey").value.trim();
 const question=input.value.trim();

 if(!question)return;
 if(!key){
  alert("Please enter your Gemini API key.");
  return;
 }

 addMessage(question,"user");
 input.value="";

 const loading=addMessage("Thinking...","ai");

 try{
  const response=await fetch(
   "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "x-goog-api-key":key
    },
    body:JSON.stringify({
     contents:[{
      parts:[{text:question}]
     }]
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message || "API Error");
  }

  const answer=data.candidates?.[0]?.content?.parts
    ?.map(p=>p.text||"").join("\n") || "No response received.";

  loading.textContent=answer;

 }catch(error){
  loading.textContent="Error: "+error.message;
 }
}

function newChat(){
 chat.innerHTML="";
 addMessage("नमस्ते! नया Chat शुरू करें।","ai");
}
</script>

</body>
</html>
